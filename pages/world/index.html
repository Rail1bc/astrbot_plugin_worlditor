<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>世界编辑器 · 调试</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="header-title">
        <h1>世界编辑器</h1>
        <span class="badge badge-debug">调试工具</span>
      </div>
      <div class="mode-switch" role="tablist" aria-label="视图模式">
        <button
          id="mode-edit"
          type="button"
          class="mode-btn active"
          role="tab"
          aria-selected="true"
        >
          编辑
        </button>
        <button id="mode-play" type="button" class="mode-btn" role="tab" aria-selected="false">
          玩家
        </button>
      </div>
      <div class="header-status">
        <span id="loc-name" class="loc-name">加载中…</span>
        <span id="player-id" class="player-id"></span>
        <button id="btn-refresh" type="button" class="btn">重新载入</button>
        <button id="btn-reregister" type="button" class="btn">重新注册</button>
      </div>
    </header>

    <main class="page-body">
      <section id="view-edit">
        <div class="edit-toolbar">
          <button id="btn-new-location" type="button" class="btn">＋ 新建地块</button>
          <button id="btn-new-exit" type="button" class="btn">＋ 新建出口</button>
          <button id="btn-toggle-avatars" type="button" class="btn">收起全部分身</button>
        </div>
        <div id="graph" class="graph"></div>
        <div id="map-error" class="map-error" hidden></div>
      </section>
      <section id="view-play" hidden>
        <div id="play-map" class="play-map"></div>
        <div id="play-info" class="play-info" hidden></div>
        <div id="play-error" class="map-error" hidden></div>
      </section>
    </main>

    <div id="modal-mask" class="modal-mask" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <span id="modal-title">提示</span>
          <button id="modal-close" type="button" class="modal-x" aria-label="关闭">✕</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
